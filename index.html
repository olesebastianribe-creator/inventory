<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#E9DFCE">
<title>Inventory</title>
<style>
:root{
  --bg:#F3EDE2; --card:#FBF8F1; --ink:#463C30; --muted:#8A7E6F;
  --line:#E3DACB; --hardline:#5C4F3F;
  --accent:#BF7150; --accentInk:#FFF9F2; --accentSoft:#F4E3DA;
  --ok:#6E9070; --okSoft:#E6EEE4; --warn:#B98A4A; --warnSoft:#F4EAD8;
  --bad:#AF5245; --badSoft:#F4E2DE; --chip:#EDE5D6;
  --deep:#5C4F3F; --sage:#7C9179;
  --vipps:#FF5B24;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;border-radius:0!important}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.45;font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit;color:inherit;width:100%;padding:11px 12px;border:1.5px solid var(--line);background:#FFFDF8;appearance:none;-webkit-appearance:none}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
label{display:block;font-size:11px;font-weight:700;color:var(--muted);margin:14px 0 5px;text-transform:uppercase;letter-spacing:.09em}
#app{max-width:560px;margin:0 auto;padding:0 14px 96px;min-height:100%}
header.top{position:sticky;top:0;z-index:20;background:#E9DFCE;color:var(--ink);margin:0 -14px 16px;padding:16px 18px 13px;display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid var(--accent)}
header.top h1{font-size:17px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
header.top .who{font-size:13px;font-weight:700;background:transparent;border:1.5px solid var(--deep);padding:7px 12px;color:var(--deep)}
.sync{font-size:11px;color:var(--muted);display:block;margin-top:3px;letter-spacing:.02em}
.card{background:var(--card);border:1.5px solid var(--line);padding:16px;margin-bottom:12px;box-shadow:0 4px 14px rgba(90,76,60,.07)}
.card h3{font-size:15px;font-weight:800;margin-bottom:8px;letter-spacing:-.01em}
h2.sect{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);margin:22px 2px 8px;display:flex;align-items:center;gap:10px}
h2.sect::after{content:"";flex:1;height:1.5px;background:var(--line)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.stat{background:var(--card);border:1.5px solid var(--line);padding:14px 12px}
.stat .v{font-size:24px;font-weight:800;letter-spacing:-.02em}
.stat .l{font-size:11px;color:var(--muted);margin-top:3px;text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.stat.hero{background:var(--sage);color:#FBF8F1;border-color:var(--sage)}
.stat.hero .l{color:rgba(251,248,241,.75)}
.prow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 0;border-bottom:1.5px solid var(--line)}
.prow:last-child{border-bottom:none}
.prow .nm{font-weight:800;letter-spacing:-.01em}
.prow .sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.chip{background:var(--chip);padding:3px 9px;font-size:12px;font-weight:700}
.chip.zero{opacity:.45}
.tot{font-size:22px;font-weight:800;min-width:46px;text-align:right;letter-spacing:-.02em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--deep);color:#FBF8F1;font-weight:800;padding:14px 18px;width:100%;font-size:15px;letter-spacing:.01em;border:1.5px solid var(--deep);transition:transform .04s}
.btn:active{transform:translateY(1px)}
.btn.sec{background:#FFFDF8;color:var(--deep);border:1.5px solid var(--deep)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:var(--accentInk)}
.btn.vipps{background:var(--vipps);border-color:var(--vipps);color:#fff}
.btn.sm{width:auto;padding:9px 14px;font-size:13px}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.45}
.btnrow{display:flex;gap:8px;margin-top:10px}
.btnrow .btn{flex:1}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:30;background:#EFE7D8;border-top:1.5px solid var(--line);display:flex;justify-content:space-around;align-items:flex-end;padding:8px 6px calc(9px + env(safe-area-inset-bottom))}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:9.5px;font-weight:700;color:var(--muted);padding:5px 8px;min-width:58px;text-transform:uppercase;letter-spacing:.08em;border-top:2px solid transparent}
nav.tabs button.on{color:var(--accent);border-top-color:var(--accent)}
nav.tabs button .ic{font-size:20px;line-height:1}
nav.tabs button.scanbtn{background:var(--accent);color:#fff;margin-top:-24px;width:62px;height:62px;justify-content:center;border:none;box-shadow:0 6px 16px rgba(191,113,80,.45)}
nav.tabs button.scanbtn .ic{font-size:26px}
nav.tabs button.scanbtn span.tl{display:none}
/* scan */
.scanwrap{position:relative;overflow:hidden;background:#2E2822;aspect-ratio:3/4;border:1.5px solid var(--deep)}
.scanwrap video{width:100%;height:100%;object-fit:cover}
.scanbox{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.scanbox .frame{width:62%;aspect-ratio:1;border:3px solid #FBF8F1;box-shadow:0 0 0 2000px rgba(46,40,34,.45)}
.scanmsg{position:absolute;bottom:12px;left:0;right:0;text-align:center;color:#fff;font-size:13.5px;font-weight:700;text-shadow:0 1px 4px rgba(0,0,0,.8);padding:0 14px}
/* modal */
.overlay{position:fixed;inset:0;background:rgba(70,60,48,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;border-top:3px solid var(--accent);padding:18px 16px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto}
.sheet h3{font-size:18px;font-weight:800;margin-bottom:4px;letter-spacing:-.01em}
.sheet .close{position:absolute;right:14px;margin-top:-4px;font-size:26px;color:var(--muted);padding:4px 10px}
.qty{display:flex;align-items:center;gap:14px;justify-content:center;margin:10px 0}
.qty button{width:54px;height:54px;background:#FFFDF8;border:1.5px solid var(--deep);font-size:26px;font-weight:800}
.qty .n{font-size:32px;font-weight:800;min-width:54px;text-align:center}
.pricechips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.pricechips button{background:#FFFDF8;border:1.5px solid var(--line);padding:8px 13px;font-size:13.5px;font-weight:700}
.pricechips button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.vippsbox{background:var(--vipps);color:#fff;padding:26px 18px;text-align:center;margin:12px 0}
.vippsbox .amt{font-size:46px;font-weight:800;letter-spacing:-.03em}
.vippsbox .nr{font-size:26px;font-weight:800;margin-top:12px;background:rgba(255,255,255,.16);padding:8px}
.vippsbox .lbl{font-size:12.5px;opacity:.9;margin-top:10px;font-weight:600}
.vippsbox img{max-width:220px;width:70%;background:#fff;padding:8px;margin-top:12px}
/* history */
.mv{padding:12px 0;border-bottom:1.5px solid var(--line);font-size:14.5px}
.mv:last-child{border-bottom:none}
.mv .t{color:var(--muted);font-size:12px;margin-top:3px}
.tag{display:inline-block;font-size:10.5px;font-weight:800;padding:2px 8px;margin-right:7px;vertical-align:1px;text-transform:uppercase;letter-spacing:.07em}
.tag.salg{background:var(--okSoft);color:var(--ok)} .tag.flytt{background:var(--accentSoft);color:var(--accent)}
.tag.inn{background:#F1E9CF;color:#8A701E} .tag.gratis{background:#FFE9DF;color:var(--vipps)}
.tag.svinn{background:var(--badSoft);color:var(--bad)} .tag.juster{background:var(--chip);color:var(--muted)}
.userpick{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.userpick button{background:#FFFDF8;border:1.5px solid var(--deep);padding:12px 16px;font-weight:800;font-size:15px;color:var(--deep)}
.userpick button.on{background:var(--deep);color:#FBF8F1}
.note{font-size:13px;color:var(--muted);margin-top:8px;line-height:1.5}
.warnbox{background:var(--warnSoft);border:1.5px solid var(--warn);padding:10px 12px;font-size:13.5px;margin:10px 0}
.okline{color:var(--ok);font-weight:800} .badline{color:var(--bad);font-weight:800}
.rowline{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1.5px solid var(--line);font-size:14.5px}
.rowline:last-child{border-bottom:none}
.rowline b{font-weight:800}
.mini{font-size:12px;color:var(--muted)}
.linkish{color:var(--accent);font-weight:700;text-decoration:underline;cursor:pointer}
/* labels / print – Lyreco Multipurpose 70×36 mm, 24 per A4 sheet (3×8, no side margins, 4.5 mm top/bottom) */
#printArea{display:none}
@media print{
  @page{size:A4 portrait;margin:0}
  html,body{background:#fff}
  body>#app,nav.tabs{display:none!important}
  #printArea{display:block!important}
  .labelsheet{width:210mm;height:297mm;padding:4.5mm 0;display:grid;grid-template-columns:repeat(3,70mm);grid-auto-rows:36mm;page-break-after:always;box-sizing:border-box}
  .labelsheet:last-child{page-break-after:auto}
  .label{display:flex;align-items:center;gap:3mm;padding:3mm 4mm;overflow:hidden;box-sizing:border-box}
  .label svg{width:26mm;height:26mm;flex:0 0 auto}
  .label .lt{text-align:left;min-width:0}
  .label .ln{font-size:10pt;font-weight:700;line-height:1.15;color:#000}
  .label .ls{font-size:8.5pt;color:#333;margin-top:0.6mm;line-height:1.15}
  .label .lp{font-size:9.5pt;font-weight:700;color:#000;margin-top:0.8mm}
}
.hidden{display:none!important}
</style>

<body>
<div id="app"></div>
<div id="printArea"></div>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script>
/* ===== Inventory – core logic ===== */
'use strict';

/* ---------- Helpers ---------- */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : (Date.now().toString(36) + Math.random().toString(36).slice(2, 10))).replace(/-/g, '').slice(0, 12);
const kr = n => (Math.round((n + Number.EPSILON) * 100) / 100).toLocaleString('en-GB', {maximumFractionDigits: 2}) + ' kr';
const fmtTime = ts => new Date(ts).toLocaleString('en-GB', {day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit'});
const vibrate = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };

/* ---------- State ---------- */
const LS_STATE = 'lagerapp_state_v1';
const LS_DEVICE = 'lagerapp_device_v1';

function defaultSettings() {
  return {
    vippsNumber: '', vippsName: '', vippsQr: '',
    locations: ['Warehouse', 'Stand', 'Store'],
    users: []
  };
}

let state = { settings: defaultSettings(), products: [], movements: [], roles: [] };
const DEFAULT_FB_CONFIG = {apiKey:"AIzaSyCvbk3aeRTuxAsu-W6z9kYR78zSQgYTu5c",authDomain:"inventory-app-34171.firebaseapp.com",projectId:"inventory-app-34171",storageBucket:"inventory-app-34171.firebasestorage.app",messagingSenderId:"42276397614",appId:"1:42276397614:web:7bc718323f7ad4d0f275bf"};
let device = { user: '', fbConfig: null, defaultLoc: '' };
let fb = { db: null, auth: null, user: null, role: null, roleName: '', connected: false, listening: false, pendingMigrate: false, status: 'Local mode (this device only)' };
let view = 'oversikt';
let moreView = 'meny';
let loginMode = 'login'; // 'login' | 'register'
let pendingName = '';

/* Role: local mode gives everyone full access; with Firebase the role controls access */
function isAdmin() { return fb.connected ? fb.role === 'admin' : true; }

function loadLocal() {
  try { const raw = localStorage.getItem(LS_STATE); if (raw) { const s = JSON.parse(raw); state = { settings: { ...defaultSettings(), ...(s.settings || {}) }, products: s.products || [], movements: s.movements || [], roles: [] }; } } catch (e) {}
  try { const raw = localStorage.getItem(LS_DEVICE); if (raw) device = { ...device, ...JSON.parse(raw) }; } catch (e) {}
}
function saveLocal() { if (!fb.connected) localStorage.setItem(LS_STATE, JSON.stringify(state)); }
function saveDevice() { localStorage.setItem(LS_DEVICE, JSON.stringify(device)); }

/* ---------- Core calculations (pure functions) ---------- */
function stockMap(movements) {
  const map = {};
  for (const mv of movements) {
    const p = map[mv.productId] || (map[mv.productId] = {});
    const add = (loc, q) => { if (!loc) return; p[loc] = (p[loc] || 0) + q; };
    if (mv.type === 'inn') add(mv.to, mv.qty);
    else if (mv.type === 'flytt') { add(mv.from, -mv.qty); add(mv.to, mv.qty); }
    else if (mv.type === 'salg' || mv.type === 'gratis' || mv.type === 'svinn') add(mv.from, -mv.qty);
    else if (mv.type === 'juster') add(mv.to, mv.qty);
  }
  return map;
}
function totalOf(perLoc) { return Object.values(perLoc || {}).reduce((a, b) => a + b, 0); }

function economy(movements, products) {
  const P = id => products.find(p => p.id === id) || {};
  const e = { cost: 0, revenue: 0, discount: 0, freeValue: 0, soldQty: 0, freeQty: 0, soldCost: 0, inQty: 0, perUser: {} };
  for (const mv of movements) {
    const p = P(mv.productId);
    if (mv.type === 'inn') { e.cost += (mv.unitCost != null ? mv.unitCost : (p.buyPrice || 0)) * mv.qty; e.inQty += mv.qty; }
    else if (mv.type === 'salg') {
      e.revenue += mv.amount || 0; e.soldQty += mv.qty; e.soldCost += (p.buyPrice || 0) * mv.qty;
      const full = (p.salePrice || 0) * mv.qty;
      if (full > (mv.amount || 0)) e.discount += full - (mv.amount || 0);
      const u = e.perUser[mv.user || 'Unknown'] || (e.perUser[mv.user || 'Unknown'] = { qty: 0, amount: 0, free: 0 });
      u.qty += mv.qty; u.amount += mv.amount || 0;
    } else if (mv.type === 'gratis') {
      e.freeQty += mv.qty; e.freeValue += (p.salePrice || 0) * mv.qty; e.soldCost += (p.buyPrice || 0) * mv.qty;
      const u = e.perUser[mv.user || 'Unknown'] || (e.perUser[mv.user || 'Unknown'] = { qty: 0, amount: 0, free: 0 });
      u.free += mv.qty;
    }
  }
  e.grossProfit = e.revenue - e.soldCost;
  e.netResult = e.revenue - e.cost;
  return e;
}

/* ---------- Storage (local + Firebase) ---------- */
const Store = {
  async addMovement(mv) {
    if (fb.connected) await fb.db.collection('movements').doc(mv.id).set(mv);
    else { state.movements.push(mv); saveLocal(); render(); }
  },
  async saveProduct(p) {
    if (fb.connected) await fb.db.collection('products').doc(p.id).set(p);
    else { const i = state.products.findIndex(x => x.id === p.id); if (i >= 0) state.products[i] = p; else state.products.push(p); saveLocal(); render(); }
  },
  async removeProduct(id) {
    if (fb.connected) await fb.db.collection('products').doc(id).delete();
    else { state.products = state.products.filter(p => p.id !== id); saveLocal(); render(); }
  },
  async saveSettings(s) {
    state.settings = s;
    if (fb.connected) await fb.db.doc('meta/settings').set(s);
    else { saveLocal(); render(); }
  }
};

function loadScript(src) {
  return new Promise((res, rej) => { const el = document.createElement('script'); el.src = src; el.onload = res; el.onerror = () => rej(new Error('Could not load ' + src)); document.head.appendChild(el); });
}

async function connectFirebase(cfg, { migrate } = {}) {
  fb.status = 'Connecting …'; render();
  await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js');
  await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js');
  await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js');
  const app = firebase.apps.length ? firebase.app() : firebase.initializeApp(cfg);
  fb.db = firebase.firestore(app);
  fb.auth = firebase.auth(app);
  try { await fb.db.enablePersistence({ synchronizeTabs: true }); } catch (e) {}
  fb.pendingMigrate = !!migrate;
  fb.connected = true;
  fb.status = 'Waiting for sign-in …';
  fb.auth.onAuthStateChanged(async u => {
    fb.user = u;
    if (u) {
      try {
        await ensureRole(u);
        if (fb.pendingMigrate) { fb.pendingMigrate = false; await migrateLocal(); }
        startListeners();
        fb.status = 'Signed in: ' + fb.roleName + ' (' + (u.isAnonymous ? 'guest' : (fb.role === 'admin' ? 'administrator' : 'seller')) + ')';
      } catch (e) { fb.status = 'Error: ' + e.message; }
    } else {
      fb.role = null; fb.roleName = '';
      fb.status = 'Not signed in';
    }
    render();
  });
  render();
}

async function ensureRole(u) {
  if (u.isAnonymous) {
    fb.role = 'selger';
    fb.roleName = device.user || 'Guest';
    setTimeout(() => { if (!device.user) openUserPick(); }, 500);
    return;
  }
  const ref = fb.db.collection('roles').doc(u.uid);
  const snap = await ref.get();
  if (snap.exists) {
    const d = snap.data();
    fb.role = d.role; fb.roleName = d.name || u.email;
  } else {
    const any = await fb.db.collection('roles').limit(1).get();
    const role = any.empty ? 'admin' : 'selger'; // the first registered user becomes administrator
    const name = (pendingName || u.email.split('@')[0]).trim();
    await ref.set({ email: u.email, name, role, createdAt: Date.now() });
    pendingName = '';
    fb.role = role; fb.roleName = name;
  }
  device.user = fb.roleName; saveDevice();
}

async function migrateLocal() {
  const snap = await fb.db.collection('movements').limit(1).get();
  const psnap = await fb.db.collection('products').limit(1).get();
  if (snap.empty && psnap.empty && (state.products.length || state.movements.length)) {
    const batch = fb.db.batch();
    state.products.forEach(p => batch.set(fb.db.collection('products').doc(p.id), p));
    state.movements.forEach(m => batch.set(fb.db.collection('movements').doc(m.id), m));
    batch.set(fb.db.doc('meta/settings'), state.settings);
    await batch.commit();
  }
}

function startListeners() {
  if (fb.listening) return;
  fb.listening = true;
  const err = e => { fb.status = 'Error: ' + e.message; render(); };
  fb.db.collection('products').onSnapshot(s => { state.products = s.docs.map(d => d.data()); render(); }, err);
  fb.db.collection('movements').onSnapshot(s => { state.movements = s.docs.map(d => d.data()).sort((a, b) => a.ts - b.ts); render(); }, err);
  fb.db.doc('meta/settings').onSnapshot(s => { if (s.exists) state.settings = { ...defaultSettings(), ...s.data() }; render(); });
  fb.db.collection('roles').onSnapshot(s => { state.roles = s.docs.map(d => ({ uid: d.id, ...d.data() })); render(); }, () => {});
}

/* ---- Sign in ---- */
async function doLogin() {
  const email = $('#liEmail').value.trim(), pw = $('#liPw').value;
  if (!email || !pw) { alert('Enter your email and password.'); return; }
  try { await fb.auth.signInWithEmailAndPassword(email, pw); }
  catch (e) { alert(loginErrTxt(e)); }
}
async function doRegister() {
  const name = $('#liName').value.trim(), email = $('#liEmail').value.trim(), pw = $('#liPw').value;
  if (!name) { alert('Enter your name.'); return; }
  if (!email || pw.length < 6) { alert('Enter an email and a password of at least 6 characters.'); return; }
  pendingName = name;
  try { await fb.auth.createUserWithEmailAndPassword(email, pw); }
  catch (e) { alert(loginErrTxt(e)); }
}
async function doPwReset() {
  const email = $('#liEmail').value.trim();
  if (!email) { alert('Enter your email address first.'); return; }
  try { await fb.auth.sendPasswordResetEmail(email); alert('A password reset email has been sent to ' + email); }
  catch (e) { alert(loginErrTxt(e)); }
}
function loginErrTxt(e) {
  const c = e.code || '';
  if (c.includes('invalid-credential') || c.includes('wrong-password') || c.includes('user-not-found')) return 'Wrong email or password.';
  if (c.includes('email-already-in-use')) return 'That email is already registered – sign in instead.';
  if (c.includes('invalid-email')) return 'Invalid email address.';
  if (c.includes('weak-password')) return 'The password must be at least 6 characters.';
  if (c.includes('operation-not-allowed')) return 'Email sign-in is not enabled in Firebase. See the setup guide (Authentication → Email/Password).';
  if (c.includes('too-many-requests')) return 'Too many attempts – wait a moment and try again.';
  return 'Something went wrong: ' + (e.message || c);
}
async function doGuest() {
  try { await fb.auth.signInAnonymously(); }
  catch (e) { alert(loginErrTxt(e)); }
}
function setLoginMode(m) { loginMode = m; render(); }
async function doLogout() {
  if (!confirm('Sign out?')) return;
  await fb.auth.signOut();
  fb.listening = false;

async function changeRole(uid, role) {
  if (!isAdmin()) return;
  const admins = state.roles.filter(r => r.role === 'admin');
  if (role !== 'admin' && admins.length === 1 && admins[0].uid === uid) { alert('Cannot remove the last administrator.'); render(); return; }
  await fb.db.collection('roles').doc(uid).set({ role }, { merge: true });
  if (fb.user && uid === fb.user.uid) { fb.role = role; fb.status = 'Signed in: ' + fb.roleName + ' (' + (role === 'admin' ? 'administrator' : 'seller') + ')'; }
  toastDone('Role updated');
}

/* ---------- Scanning ---------- */
let scan = { stream: null, running: false, lastCode: '', lastAt: 0, detector: null, canvas: null };

async function startScan() {
  const video = $('#scanVideo');
  if (!video) return;
  const msg = $('#scanMsg');
  if (!scan.stream) {
    try {
      scan.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1280 } }, audio: false });
    } catch (e) {
      if (msg) msg.textContent = 'No camera access. Check permissions – or pick a product manually below.';
      return;
    }
  }
  video.srcObject = scan.stream;
  video.setAttribute('playsinline', '');
  await video.play().catch(() => {});
  if (scan.running) return; // loop already running
  scan.running = true;
  if ('BarcodeDetector' in window) {
    try { scan.detector = new BarcodeDetector({ formats: ['qr_code', 'code_128', 'ean_13'] }); } catch (e) { scan.detector = null; }
  }
  if (!scan.detector) { scan.canvas = document.createElement('canvas'); }
  scanLoop();
}

async function scanLoop() {
  if (!scan.running) return;
  const video = $('#scanVideo');
  if (video && video.readyState >= 2) {
    let text = null;
    if (scan.detector) {
      try { const codes = await scan.detector.detect(video); if (codes.length) text = codes[0].rawValue; } catch (e) {}
    } else if (window.jsQR) {
      const c = scan.canvas, w = 480, h = Math.round(480 * video.videoHeight / video.videoWidth) || 640;
      c.width = w; c.height = h;
      const ctx = c.getContext('2d', { willReadFrequently: true });
      ctx.drawImage(video, 0, 0, w, h);
      const d = ctx.getImageData(0, 0, w, h);
      const code = jsQR(d.data, w, h, { inversionAttempts: 'dontInvert' });
      if (code && code.data) text = code.data;
    }
    if (text) handleCode(text);
  }
  setTimeout(() => requestAnimationFrame(() => scanLoop()), scan.detector ? 120 : 60);
}

function stopScan() {
  scan.running = false;
  if (scan.stream) { scan.stream.getTracks().forEach(t => t.stop()); scan.stream = null; }
}

function findByCode(text) {
  let id = null;
  if (text.startsWith('LGR:')) id = text.slice(4).trim();
  return state.products.find(x => x.id === id || x.code === text || (x.extraCodes || []).includes(text));
}
function handleCode(text) {
  if ($('#overlay')) return; // don't keep scanning while a dialog is open
  const now = Date.now();
  if (text === scan.lastCode && now - scan.lastAt < 2500) return;
  scan.lastCode = text; scan.lastAt = now;
  const p = findByCode(text);
  const msg = $('#scanMsg');
  if (p) { vibrate(80); openActions(p.id); return; }
  vibrate([40, 60, 40]);
  if (text.startsWith('LGR:')) {
    // one of our codes that isn't linked to a product yet
    if (isAdmin()) openLinkCode(text);
    else if (msg) msg.textContent = 'This code is not linked to a product yet – ask an administrator to scan it first.';
  } else if (msg) { msg.textContent = 'Unknown code: ' + text.slice(0, 40); }
}

/* Link a pre-printed code to a product */
function openLinkCode(text) {
  const short = text.replace('LGR:', '');
  const rows = state.products.map(p => `<button class="btn sec" style="margin-bottom:8px" onclick="linkCode('${p.id}')">${esc(p.name)}${p.size ? ' – ' + esc(p.size) : ''}</button>`).join('');
  window._pendingLink = text;
  openSheet(`
    <h3>New code scanned</h3>
    <p class="note">The code <b>${esc(short)}</b> is not linked to a product yet. Choose which product this sticker is on – next time it's scanned it will go straight to the product.</p>
    ${rows || '<p class="note">No products yet – add a product first.</p>'}
  `);
}
async function linkCode(pid) {
  const p = state.products.find(x => x.id === pid); if (!p || !window._pendingLink) return;
  const codes = p.extraCodes || [];
  if (!codes.includes(window._pendingLink)) codes.push(window._pendingLink);
  await Store.saveProduct({ ...p, extraCodes: codes });
  window._pendingLink = null;

}

/* ---- Sell ---- */
let sell = null;
function openSell(pid) {
  const p = state.products.find(x => x.id === pid); if (!p) return;
  const st = stockMap(state.movements)[pid] || {};
  const locs = state.settings.locations;
  const from = device.defaultLoc && locs.includes(device.defaultLoc) ? device.defaultLoc : (locs.find(l => (st[l] || 0) > 0) || locs[0] || 'Warehouse');
  sell = { pid, qty: 1, pct: 0, custom: null, price: p.salePrice || 0, from, reason: '' };
  renderSell();
}
function renderSell() {
  const p = state.products.find(x => x.id === sell.pid);
  const st = stockMap(state.movements)[sell.pid] || {};
  const full = (p.salePrice || 0);
  const cps = state.settings.customPrices || [];
  const cp = sell.custom != null ? cps[sell.custom] : null;
  let unit;
  if (cp) unit = cp.pct != null ? Math.round(full * (100 - cp.pct)) / 100 : cp.price;
  else unit = sell.pct === 100 ? 0 : Math.round(full * (100 - sell.pct)) / 100;
  sell.price = unit;
  const total = unit * sell.qty;
  const needReason = !cp && sell.pct > 0;
  const locOpts = state.settings.locations.map(l => `<option value="${esc(l)}" ${l === sell.from ? 'selected' : ''}>${esc(l)} (${st[l] || 0} pcs)</option>`).join('');
  const chip = (lbl, pct) => `<button class="${!cp && sell.pct === pct ? 'on' : ''}" onclick="sellPct(${pct})">${lbl}</button>`;
  const customChips = cps.map((c, i) => `<button class="${sell.custom === i ? 'on' : ''}" onclick="sellCustom(${i})">${esc(c.label)}</button>`).join('');
  openSheet(`
    <h3>Sell: ${esc(p.name)}${p.size ? ' – ' + esc(p.size) : ''}</h3>
    <div class="qty">
      <button onclick="sellQty(-1)">−</button><span class="n">${sell.qty}</span><button onclick="sellQty(1)">+</button>
    </div>
    <label>Price</label>
    <div class="pricechips">
      ${chip('Full price ' + kr(full), 0)}${chip('−10%', 10)}${chip('−25%', 25)}${chip('−50%', 50)}${chip('Free 🎁', 100)}${customChips}
    </div>
    ${needReason ? `<label>Reason (discount/free) *</label><input id="sellReason" value="${esc(sell.reason)}" placeholder="E.g. friend price, prize, damaged item" oninput="sell.reason=this.value">` : ''}
    <label>Sold from</label>
    <select onchange="sell.from=this.value">${locOpts}</select>
    <div class="vippsbox" style="padding:14px"><div class="amt" style="font-size:30px">${unit === 0 ? 'FREE' : kr(total)}</div><div class="lbl">${sell.qty} pcs × ${kr(unit)}${cp ? ' · ' + esc(cp.label) : ''}</div></div>
    <button class="btn accent" onclick="confirmSell()">Register ${unit === 0 ? 'free giveaway' : 'sale'}</button>
  `);
}
function sellQty(d) { sell.qty = Math.max(1, sell.qty + d); renderSell(); }
function sellPct(pct) { sell.pct = pct; sell.custom = null; renderSell(); }
function sellCustom(i) { sell.custom = i; renderSell(); }
async function confirmSell() {
  const p = state.products.find(x => x.id === sell.pid);
  if (!requireUser()) return;
  const cps = state.settings.customPrices || [];
  const cp = sell.custom != null ? cps[sell.custom] : null;
  if (!cp && sell.pct > 0 && !sell.reason.trim()) { alert('Enter a reason for the discount/free item – it is stored in the log.'); return; }
  const from = sell.from;
  const free = sell.price === 0;
  const full = (p.salePrice || 0);
  const pct = cp ? (full > 0 ? Math.round((1 - sell.price / full) * 100) : 0) : sell.pct;
  const reason = cp ? cp.label : sell.reason.trim();
  const mv = {
    id: uid(), ts: Date.now(), user: device.user, productId: p.id,
    type: free ? 'gratis' : 'salg', qty: sell.qty, from, to: '',
    unitPrice: free ? 0 : sell.price, amount: free ? 0 : Math.round(sell.price * sell.qty * 100) / 100,
    discountPct: pct, reason
  };
  await Store.addMovement(mv);
  device.defaultLoc = from; saveDevice();
  if (free) { closeSheet(); toastDone('Registered as free 🎁'); }
  else showVipps(mv, p);
}

function vHistorikk() {

  const typeTxt = { salg: 'Sale', flytt: 'Move', inn: 'Stock in', gratis: 'Free', svinn: 'Loss', juster: 'Adjust' };
  const rows = [...state.movements].sort((a, b) => b.ts - a.ts).slice(0, 200).map(m => {
    const p = P(m.productId);
    const what = `${m.qty} × ${esc(p.name)}${p.size ? ' ' + esc(p.size) : ''}`;
    let line = '';
    if (m.type === 'salg') line = `${what} for <b>${kr(m.amount)}</b>${m.discountPct ? ` (−${m.discountPct}%)` : ''} from ${esc(m.from)}`;
    else if (m.type === 'gratis') line = `${what} given away from ${esc(m.from)}`;
    else if (m.type === 'flytt') line = `${what}: ${esc(m.from)} → ${esc(m.to)}`;
    else if (m.type === 'inn') line = `${what} received into ${esc(m.to)}`;

/* Chunk labels into A4 sheets of 24 (Lyreco 70×36 mm, 3×8) */
const LABELS_PER_SHEET = 24;
function labelSheets(labels) {
  let html = '';
  for (let i = 0; i < labels.length; i += LABELS_PER_SHEET) {
    html += '<div class="labelsheet">' + labels.slice(i, i + LABELS_PER_SHEET).join('') + '</div>';
  }
  return html;
}
function labelHtml(svg, lines) {
  // lines: [{t: text, cls: 'ln'|'ls'|'lp'}]
  const txt = lines.filter(l => l.t).map(l => `<div class="${l.cls}">${l.t}</div>`).join('');
  return `<div class="label">${svg}<div class="lt">${txt}</div></div>`;
}
function productLabel(p, svg) {
  return labelHtml(svg, [
    { t: esc(p.name), cls: 'ln' },
    { t: esc(p.collection || ''), cls: 'ls' },
    { t: p.size ? 'Size: ' + esc(p.size) : '', cls: 'ls' },
    { t: kr(p.salePrice || 0), cls: 'lp' }
  ]);
}

function printLabels() {
  const labels = [];
  $$('input[data-labelqty]').forEach(inp => {
    const p = state.products.find(x => x.id === inp.dataset.labelqty);
    const n = parseInt(inp.value, 10) || 0;
    if (!p || n < 1) return;
    const q = qrcode(0, 'M'); q.addData('LGR:' + p.id); q.make();
    const svg = q.createSvgTag({ cellSize: 3, margin: 0, scalable: true });
    for (let i = 0; i < n; i++) labels.push(productLabel(p, svg));
  });
  if (!labels.length) { alert('Choose how many labels first.'); return; }
  $('#printArea').innerHTML = labelSheets(labels);
  window.print();
}

function printGeneric() {
  const n = Math.min(500, parseInt($('#genCount').value, 10) || 0);
  if (n < 1) { alert('Choose a number first.'); return; }
  const labels = [];
  for (let i = 0; i < n; i++) {
    const code = 'GEN-' + uid().slice(0, 8).toUpperCase();
    const q = qrcode(0, 'M'); q.addData('LGR:' + code); q.make();
    labels.push(labelHtml(q.createSvgTag({ cellSize: 3, margin: 0, scalable: true }), [{ t: code, cls: 'ln' }, { t: 'Scan and link in the app', cls: 'ls' }]));
  }
  $('#printArea').innerHTML = labelSheets(labels);
  window.print();
}

async function addCustomPrice() {
  const label = $('#cpLabel').value.trim(), raw = $('#cpValue').value.trim();
  if (!label || !raw) { alert('Enter a name and a price (e.g. 299) or a discount (e.g. 25%).'); return; }
  let entry;
  const num = parseFloat(raw.replace(',', '.'));
  if (raw.endsWith('%')) {
    if (isNaN(num) || num < 0 || num > 100) { alert('Invalid percentage.'); return; }
    entry = { label, pct: num };
  } else {
    if (isNaN(num) || num < 0) { alert('Invalid price.'); return; }
    entry = { label, price: num };
  }
  await Store.saveSettings({ ...state.settings, customPrices: [...(state.settings.customPrices || []), entry] });
  toastDone('Price added');
}
async function removeCustomPrice(i) {
  await Store.saveSettings({ ...state.settings, customPrices: (state.settings.customPrices || []).filter((_, x) => x !== i) });
}
async function saveSettingsForm() {

    ...state.settings,

    vippsName: $('#setVippsName').value.trim(),
    users: $('#setUsers') ? $('#setUsers').value.split(',').map(x => x.trim()).filter(Boolean) : state.settings.users,
    locations: $('#setLocs').value.split(',').map(x => x.trim()).filter(Boolean)
  };

}
function setVippsQr(inp) {
  const f = inp.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = async () => {
    // shrink the image so it doesn't get too large
    const img = new Image();
    img.onload = async () => {
      const c = document.createElement('canvas');
      const max = 500, sc = Math.min(1, max / Math.max(img.width, img.height));
      c.width = img.width * sc; c.height = img.height * sc;
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      await Store.saveSettings({ ...state.settings, vippsQr: c.toDataURL('image/jpeg', 0.85) });
      toastDone('QR image saved'); render();
    };
    img.src = r.result;
  };
  r.readAsDataURL(f);
}
async function clearVippsQr() { await Store.saveSettings({ ...state.settings, vippsQr: '' }); render(); }

async function connectFromForm() {
  let cfg;
  const txt = $('#setFbCfg').value.trim();
  try {
    // accept both plain JSON and a JS object copied from the Firebase console
    cfg = JSON.parse(txt.replace(/^\s*(const|var|let)\s+\w+\s*=\s*/, '').replace(/;\s*$/, '').replace(/'/g, '"').replace(/([,{]\s*)([A-Za-z_$][\w$]*)\s*:/g, '$1"$2":'));
  } catch (e) { alert('Could not read the configuration. Paste the object from the Firebase console.'); return; }
  try {
    device.fbConfig = cfg; saveDevice();
    await connectFirebase(cfg, { migrate: true });
    toastDone('Connected!');
  } catch (e) { fb.status = 'Error: ' + e.message; render(); alert('Connection failed: ' + e.message); }
}
function disconnectFb() {
  device.fbConfig = null; saveDevice();
  alert('Disconnected. Reload the page to finish.');
  location.reload();
}

function exportBackup() {
  download('inventory-backup-' + new Date().toISOString().slice(0, 10) + '.json', JSON.stringify(state, null, 2), 'application/json');
}
function importBackup(inp) {
  const f = inp.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = async () => {
    try {
      const s = JSON.parse(r.result);
      if (!confirm('Replace all data with the contents of this backup?')) return;
      if (fb.connected) {
        const batch = fb.db.batch();
        (s.products || []).forEach(p => batch.set(fb.db.collection('products').doc(p.id), p));
        (s.movements || []).forEach(m => batch.set(fb.db.collection('movements').doc(m.id), m));
        batch.set(fb.db.doc('meta/settings'), { ...defaultSettings(), ...(s.settings || {}) });
        await batch.commit();
      } else {
        state = { settings: { ...defaultSettings(), ...(s.settings || {}) }, products: s.products || [], movements: s.movements || [], roles: [] };
        saveLocal(); render();
      }
      toastDone('Backup imported');
    } catch (e) { alert('Invalid backup file.'); }
  };
  r.readAsText(f);
}
async function resetAll() {
  if (!confirm('Delete EVERYTHING (products, history, settings)?')) return;
  if (!confirm('Completely sure? This cannot be undone.')) return;
  if (fb.connected) {
    const batch = fb.db.batch();
    (await fb.db.collection('products').get()).forEach(d => batch.delete(d.ref));
    (await fb.db.collection('movements').get()).forEach(d => batch.delete(d.ref));
    batch.set(fb.db.doc('meta/settings'), defaultSettings());
    await batch.commit();
  } else {
    state = { settings: defaultSettings(), products: [], movements: [], roles: [] };
    saveLocal(); render();
  }
}

function exportCSV() {
  const P = id => state.products.find(p => p.id === id) || {};
  const head = 'Date;Type;Person;Product;Collection;Size;Qty;From;To;Unit price;Amount;Discount %;Reason';
  const typeTxt = { salg: 'Sale', flytt: 'Move', inn: 'Stock in', gratis: 'Free', svinn: 'Loss', juster: 'Adjust' };
  const lines = state.movements.map(m => {
    const p = P(m.productId);
    return [new Date(m.ts).toLocaleString('en-GB'), typeTxt[m.type] || m.type, m.user || '', p.name || '', p.collection || '', p.size || '', m.qty, m.from || '', m.to || '',
      String(m.unitPrice ?? ''), String(m.amount ?? ''), m.discountPct || 0, (m.reason || '').replace(/;/g, ',')].join(';');
  });
  download('sales-log.csv', '﻿' + [head, ...lines].join('\r\n'), 'text/csv');
}
function download(name, content, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([content], { type }));
  a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

  if (!device.fbConfig) device.fbConfig = DEFAULT_FB_CONFIG;
  if (device.fbConfig) {
    try { await connectFirebase(device.fbConfig, { migrate: false }); return; }
    catch (e) { fb.status = 'Offline (' + e.message + ') – using local data'; }
  }
  render();
  if (!device.user) openUserPick();
});

</script>
</body>
</html>
